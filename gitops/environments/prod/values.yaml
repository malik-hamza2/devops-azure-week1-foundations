# Production Environment Configuration
replicaCount: 5

image:
  repository: ghcr.io/malik-hamza2/two-tier-flask
  tag: "v1"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

environment: prod
